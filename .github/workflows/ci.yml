name: CI - Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp2_project_setup_code
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tp2_project_setup_code/package-lock.json

      - name: Setup Java (requis pour l'émulateur Firebase)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Jest with Firebase Emulators
        run: npx firebase emulators:exec --only firestore,auth "npm test -- --ci --coverage --maxWorkers=2"

  e2e-android:
    name: Maestro E2E (Android)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tp2_project_setup_code/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        working-directory: tp2_project_setup_code
        run: npm ci

      - name: Prebuild Android
        working-directory: tp2_project_setup_code
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: tp2_project_setup_code/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: |
            adb install -r tp2_project_setup_code/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --format junit --output maestro-results.xml tp2_project_setup_code/.maestro/

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-results.xml
            ~/.maestro/tests/

  build-dev-apk:
    name: Upload Dev APK Artifact
    runs-on: ubuntu-latest
    needs: e2e-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tp2_project_setup_code/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: tp2_project_setup_code
        run: npm ci

      - name: Prebuild Android
        working-directory: tp2_project_setup_code
        run: npx expo prebuild --platform android --no-install

      - name: Build Debug APK
        working-directory: tp2_project_setup_code/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Mettre à disposition l'APK de dev
        uses: actions/upload-artifact@v4
        with:
          name: app-development-apk
          path: tp2_project_setup_code/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7